<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15211A" />

    <!-- Google Analytics 4 (gtag.js). The measurement ID comes from the single
         VITE_GA_MEASUREMENT_ID env var — Vite inlines %VITE_GA_MEASUREMENT_ID%
         at build time, so it is never hardcoded here. Loads on every page since
         this is the SPA's only HTML entry. Custom events live in src/utils/analytics.ts. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%');
    </script>

    <!-- Primary meta (per-page values are set at runtime by the <Seo> component) -->
    <title>Nova Nest | Buy, Rent &amp; Sell Property in Bengaluru</title>
    <meta
      name="description"
      content="Nova Nest Property Management — verified apartments, villas, plots and commercial spaces for sale and rent in Whitefield, Marathahalli, Bellandur and across Bengaluru."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://novanest.co.in/" />

    <!-- Icons + PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph (defaults; overridden per page for JS-rendering crawlers) -->
    <meta property="og:site_name" content="Nova Nest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nova Nest | Buy, Rent &amp; Sell Property in Bengaluru" />
    <meta
      property="og:description"
      content="Verified apartments, villas, plots and commercial spaces for sale and rent across Bengaluru."
    />
    <meta property="og:url" content="https://novanest.co.in/" />
    <meta property="og:image" content="https://novanest.co.in/og-image.jpg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova Nest | Buy, Rent &amp; Sell Property in Bengaluru" />
    <meta
      name="twitter:description"
      content="Verified apartments, villas, plots and commercial spaces for sale and rent across Bengaluru."
    />
    <meta name="twitter:image" content="https://novanest.co.in/og-image.jpg" />

    <!-- TODO: paste the real Google Search Console verification code and keep this tag -->
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_GSC_VERIFICATION_CODE" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
