AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nova Nest Magicbricks and Housing push integrations using the existing CRM PostgreSQL database
Parameters:
  DatabaseSecretArn:
    Type: String
    Description: Existing Secrets Manager secret ARN with DATABASE_URL set to the CRM connection string
    AllowedPattern: 'arn:[^:]+:secretsmanager:[^:]+:[0-9]+:secret:.+'
  ReservedConcurrency:
    Type: Number
    Default: -1
    MinValue: -1
    Description: '-1 uses shared account capacity; positive values reserve a limit; 0 pauses the function'
  BurstLimit:
    Type: Number
    Default: 10
    MinValue: 1
  RateLimit:
    Type: Number
    Default: 5
    MinValue: 1
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional existing SNS topic for alarm notifications
  DedupeRule:
    Type: String
    Default: mobile_project
    AllowedValues: [mobile_project, source_mobile_project]
Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]
Resources:
  IntegrationKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Magicbricks API keys; active is current, keys contains overlap keys during rotation
      GenerateSecretString:
        SecretStringTemplate: '{"keys":[]}'
        GenerateStringKey: active
        PasswordLength: 48
        ExcludePunctuation: true
  HousingKey:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Independently rotating Housing API keys; active is current and keys contains overlap keys
      GenerateSecretString:
        SecretStringTemplate: '{"keys":[]}'
        GenerateStringKey: active
        PasswordLength: 48
        ExcludePunctuation: true
  HttpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref BurstLimit
        ThrottlingRateLimit: !Ref RateLimit
      AccessLogSettings:
        DestinationArn: !GetAtt HttpLogs.Arn
        Format: '{"requestId":"$context.requestId","status":"$context.status","route":"$context.routeKey"}'
  Integration:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../.magicbricks-package/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 256
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:DATABASE_URL}}'
          MAGICBRICKS_API_KEY_SECRET_ARN: !Ref IntegrationKey
          HOUSING_API_KEY_SECRET_ARN: !Ref HousingKey
          MAGICBRICKS_DEDUPE_RULE: !Ref DedupeRule
          DB_CONNECTION_TIMEOUT_MS: '2000'
          NODE_ENV: production
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: [!Ref IntegrationKey, !Ref HousingKey]
      Events:
        GetLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/leads/create
            Method: GET
            PayloadFormatVersion: '2.0'
        PostLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/leads/create
            Method: POST
            PayloadFormatVersion: '2.0'
        HousingLead:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/leads/create/housing
            Method: POST
            PayloadFormatVersion: '2.0'
        MagicbricksGetAlias:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/leads/create/magicbricks
            Method: GET
            PayloadFormatVersion: '2.0'
        MagicbricksPostAlias:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/leads/create/magicbricks
            Method: POST
            PayloadFormatVersion: '2.0'
  LambdaLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Integration}'
      RetentionInDays: 30
  Errors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Magicbricks handler failed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Integration }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
  Http5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Magicbricks HTTP endpoint returned server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref Api }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
  Throttles:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{ Name: FunctionName, Value: !Ref Integration }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref 'AWS::NoValue']
Outputs:
  Endpoint:
    Description: HTTPS URL to share with the Magicbricks account manager
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/leads/create'
  ApiKeySecretArn:
    Value: !Ref IntegrationKey
  HousingEndpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/leads/create/housing'
  MagicbricksEndpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/leads/create/magicbricks'
  HousingApiKeySecretArn:
    Value: !Ref HousingKey
  FunctionName:
    Value: !Ref Integration
